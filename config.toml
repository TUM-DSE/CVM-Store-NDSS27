# Host-specific device PCI addresses and VM resource overrides. The accelstore
# module generates the SPDK bdev config from these entries at run time.

[defaults]
# output_root = "/path/to/build-output"
#   Optional: override where build artifacts (build/) are written.
#   Defaults to the directory containing this config.toml (the repo root).
ssh_port = 2225
vm_ip = "172.44.0.2"
valid_pcie_speeds = [4, 5]
# modules/attestation: defaults are 8000, the QEMU user-net gateway, and the
# host's own EPYC generation (genoa if /proc/cpuinfo does not tell).
# attestation_server_port = 8000
# attestation_host_gateway = "10.0.2.2"
# attestation_processor_model = "genoa"

[defaults.vm_resources]
small  = { cpu = 1,  memory = 8,   numa_node = [0], pin_base = 8 }
medium = { cpu = 8,  memory = 64,  numa_node = [0], pin_base = 8 }
large  = { cpu = 32, memory = 256, numa_node = [0], pin_base = 0 }
numa   = { cpu = 64, memory = 512, numa_node = [0, 1], pin_base = 0 }

[qemu_devices]
nvme_pci = "0000:00:06.0"
nvme_dev_path = "/dev/disk/by-id/nvme-QEMU_NVMe_Ctrl_deadbeef_1"

[vm_device_addresses]
snp = "0000:01:00.0"
amd = "0000:01:00.0"

[hosts.vislor]
nvme_pci = "0000:e1:00.0"
dev_path = "/dev/disk/by-id/nvme-KIOXIA_KCMYXRUG3T84_8F30A0240LM3_1"
valid_pcie_speeds = [4, 5]

[hosts.vislor.vm_resources]
# NVMe is on NUMA 1
small  = { cpu = 1,  memory = 8,   numa_node = [1], pin_base = 0 }
medium = { cpu = 64, memory = 64,  numa_node = [1, 0], pin_base = 0 }
large  = { cpu = 32, memory = 256, numa_node = [1], pin_base = 0 }
numa   = { cpu = 64, memory = 512, numa_node = [1, 0], pin_base = 0 }