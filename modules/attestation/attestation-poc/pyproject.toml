[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attestation-poc"
version = "0.1.0"
description = "Attestation benchmark client and server for SEV-SNP"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "eciespy>=0.4.0",
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "urllib3>=2.0.0",
]

[project.scripts]
attestation-client = "client.main:main"
attestation-server = "server.main:main"

[tool.setuptools]
packages = ["common", "client", "server"]
